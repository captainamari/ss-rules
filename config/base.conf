📈 券商服务 = select,🚀 默认代理,🖐 手动选择,🇭🇰 香港自动,🇺🇸 美国自动,🎯 直接连接,⛔ 禁止连接,policy-select-name=🚀 默认代理
🇨🇳 国内服务 = select,🎯 直接连接,🚀 默认代理,🖐 手动选择,⛔ 禁止连接,policy-select-name=🎯 直接连接
