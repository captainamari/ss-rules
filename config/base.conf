# ③ 线路选择：手动组固定一条线路；自动组每 10 分钟测速，减少小幅延迟变化引起的切换。
🖐 手动选择 = select,📱 跟随首页,policy-select-name=📱 跟随首页,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).+
⚡ 自动测速 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).+
🇭🇰 香港自动 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).*(🇭🇰|香港|深港|沪港|滬港|京港|(?i:(^|[^a-z])(hk|hkg|hong[ _-]?kong)([^a-z]|$)))
🇹🇼 台湾自动 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).*(🇹🇼|台湾|台灣|台北|新北|台中|(?i:(^|[^a-z])(tw|twn|taiwan|taipei)([^a-z]|$)))
🇯🇵 日本自动 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).*(🇯🇵|日本|东京|東京|大阪|(?i:(^|[^a-z])(jp|jpn|japan|tokyo|osaka)([^a-z]|$)))
🇺🇸 美国自动 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).*(🇺🇸|美国|美國|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|(?i:(^|[^a-z])(us|usa|united[ _-]?states|america)([^a-z]|$)))

# ④ 网络选项：仅影响名单中的应用内 DNS 服务，日常保持直接连接。
🧰 应用内 DNS = select,🎯 直接连接,🚀 默认代理,⛔ 禁止连接,policy-select-name=🎯 直接连接

# 固定动作：作为中文选项使用，隐藏独立卡片。
📱 跟随首页 = select,PROXY,policy-select-name=PROXY,hidden=1
🎯 直接连接 = select,DIRECT,policy-select-name=DIRECT,hidden=1
⛔ 禁止连接 = select,REJECT,policy-select-name=REJECT,hidden=1

[Rule]
# @RULES@

[Host]
localhost = 127.0.0.1
localhost.weixin.qq.com = 127.0.0.1
localhost.work.weixin.qq.com = 127.0.0.1
*.local = server:system
*.home.arpa = server:system
*.in-addr.arpa = server:system
*.ip6.arpa = server:system
