# ③ 可选自动线路：默认不使用；只有已有对应地区节点时才选择地区组。
# 每 10 分钟测速；混合地区名称可能匹配多个组，请核对或直接选节点。
⚡ 自动测速 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).+
🇭🇰 香港自动 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).*(🇭🇰|香港|深港|沪港|滬港|京港|(?i:(^|[^a-z])(hk|hkg|hong[ _-]?kong)([^a-z]|$)))
