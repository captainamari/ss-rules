🇯🇵 日本自动 = url-test,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!.*(剩余|到期|流量|套餐|官网|网站|订阅|重置|客服|通知|公告|(?i:traffic|expire|subscription|official|website))).*(🇯🇵|日本|东京|東京|大阪|(?i:(^|[^a-z])(jp|jpn|japan|tokyo|osaka)([^a-z]|$)))
