📮 邮件服务 = select,🚀 默认代理,🖐 手动选择,🎯 直接连接,🇯🇵 日本自动,🇭🇰 香港自动,⛔ 禁止连接,policy-select-name=🚀 默认代理
🍏 Apple 服务 = select,🎯 直接连接,🚀 默认代理,🖐 手动选择,⛔ 禁止连接,policy-select-name=🎯 直接连接
